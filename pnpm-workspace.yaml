packages:
  - "apps/*"
  - "packages/*"
# Scripts de build aprobados (pnpm 11; reemplaza pnpm.onlyBuiltDependencies).
# Nativos necesarios en true; @scarf/scarf es telemetria y se omite.
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - qs@6.15.4 || 6.16.0
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11 || 4.1.12'
  - ip-address@10.5.1 || 10.7.1 || 10.7.4
  - source-map-js@1.2.2
overrides:
  js-yaml: ^5.2.2
