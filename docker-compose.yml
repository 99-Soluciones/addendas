# Orquestación local/servidor. La base de datos es Supabase (externa), por eso
# no hay servicio de Postgres aquí. El servicio "web" (nginx) es el punto de
# entrada público y hace de API gateway hacia "api".

services:
  api:
    image: ghcr.io/lsheel/addendex-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
    expose:
      - "3000"
    restart: unless-stopped

  web:
    image: ghcr.io/lsheel/addendex-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
