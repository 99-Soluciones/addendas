# NGINX como API Gateway + servidor de la SPA.
# Sirve los estáticos del frontend y enruta /api/* al backend Express.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El CFDI puede ser grande.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend Express (servicio "api" del compose).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
